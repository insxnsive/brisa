name: Windows build and release

on:
  push:
    branches: [brisa]
    tags: ['v*']
  pull_request:
    branches: [brisa]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: tools/proton-confgen/go.mod
          cache-dependency-path: tools/proton-confgen/go.sum
      - name: Install locked build tools
        run: |
          npm ci --prefix backend
          dotnet tool restore
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python packaging/release.py check-tag
      - name: Run offline tests
        run: python packaging/test.py
      - name: Package installer, portable app and source
        run: python packaging/package.py
      - name: Exercise isolated portable update
        run: python packaging/update_smoke.py
      - name: Validate release files
        run: python packaging/release.py verify artifacts/releases
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Brisa-win-x64
          path: artifacts/releases/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/') && github.repository == 'insxnsive/brisa'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Brisa-win-x64
          path: artifacts/releases
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Publish matching version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python packaging/release.py publish artifacts/releases
